version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mahat-postgres
    environment:
      POSTGRES_DB: mahatbank
      POSTGRES_USER: mahatuser
      POSTGRES_PASSWORD: MahatBank2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mahat-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mahatbank.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
