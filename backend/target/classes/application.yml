spring:
  application:
    name: mahat-bank-backend

  datasource:
    url: jdbc:mysql://localhost:3306/mahatbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: # Leave blank if you have no password for root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: MahatBankSuperSecretKey2024!ForJWTTokenSigning
    expiration: 86400000

server:
  port: 9090
  servlet:
    context-path: /api

logging:
  level:
    com.mahatbank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO
